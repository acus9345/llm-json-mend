name: Publish

# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# Runs when a GitHub release is published, and waits for approval on the "npm" environment.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets the job get the short-lived identity token npm trusts

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # ships npm 11, which supports trusted publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no dependency cache in release builds
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      # Diagnostics for trusted publishing: prints the identity claims npm matches
      # against the trusted publisher entry. The token itself is never printed.
      - name: Show OIDC claims
        run: |
          node -e '
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set("audience", "npm:registry.npmjs.org");
            fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })
              .then((r) => r.json())
              .then(({ value }) => {
                const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url"));
                const keys = ["aud", "repository", "repository_owner", "workflow_ref", "job_workflow_ref", "ref", "event_name", "environment", "sub"];
                for (const k of keys) console.log(`${k}: ${claims[k]}`);
              });
          '
      - run: npm publish --loglevel verbose # prepublishOnly runs the full check first
